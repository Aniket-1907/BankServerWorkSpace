server.port=9012
server.servlet.context-path=/auth

spring.application.name=BankApp-AuthenticationService

spring.datasource.url=jdbc:mysql://localhost:3306/bankapp_auth_db?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.boot.admin.client.url=http://localhost:9090

eureka.client.service-url.defaultZone=http://localhost:3333/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*
