server:
  port: 5555
  servlet:
    context-path: "/transaction"
 
spring:
  application:
    name: BankApp-TransactionService
  boot:
   admin:
    client:
     url: http://localhost:9090 
  datasource:
    url: jdbc:mysql://localhost:3306/TransactionDB?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
 
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
       hibernate:
            dialect: org.hibernate.dialect.MySQLDialect
                                      
eureka:
  client:
    service-url : 
            defaultZone: http://localhost:3333/eureka/          
            
    register-with-eureka: true
    fetch-registry: true 
 
  instance:
    prefer-ip-address: true
    
axon:
  eventhandling:
    processors:
      name:
        mode: tracking
        
  distributed:
    enabled: true
    
management:
 endpoints:
  health:
   show-details: always
  web:
   exposure:
    include: '*'