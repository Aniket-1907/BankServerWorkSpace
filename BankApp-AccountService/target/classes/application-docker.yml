server:
  port: 7777
  servlet:
    context-path: /account

spring:
  application:
    name: BankApp-AccountService
  datasource:
    url: jdbc:mysql://mysql-account-container:3306/accountdb?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  boot:
    admin:
      client:
        url:
        - http://bankapp-monitoring-container:9090

eureka:
  client:
    service-url:
      defaultZone: http://bankapp-eureka-container:3333/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true


axon:
  eventhandling:
    processors:
      name:
        mode: tracking
        source: eventBus
  distributed:
    enabled: true
  serializer:
    events: jackson

management:
  endpoints:
    health:
      show-details: always
    web:
      exposure:
        include: '*'