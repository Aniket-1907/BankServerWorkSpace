#version: "3.8"

networks:
  springboot-mysql-net:
    driver: bridge

volumes:
  redis-data:

services:

  # =========================
  # DATABASES
  # =========================

  customer-db:
    container_name: bankapp-customer-db
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: CustomerDB
    networks:
      - springboot-mysql-net
    restart: unless-stopped

  account-db:
    container_name: bankapp-account-db
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: AccountDB
    networks:
      - springboot-mysql-net
    restart: unless-stopped

  transaction-db:
    container_name: bankapp-transaction-db
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: TransactionDB
    networks:
      - springboot-mysql-net
    restart: unless-stopped

  auth-db:
    container_name: bankapp-auth-db
    image: mysql:8.0
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: AuthDB
    networks:
      - springboot-mysql-net
    restart: unless-stopped

  # =========================
  # AXON SERVER
  # =========================

  axonserver:
    container_name: bankapp-axonserver
    image: axoniq/axonserver:4.6.7
    hostname: axonserver
    environment:
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true"
    ports:
      - "8024:8024"
      - "8124:8124"
    networks:
      - springboot-mysql-net
    restart: unless-stopped

  # =========================
  # REDIS
  # =========================

  redis-server:
    container_name: bankapp-redis
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - springboot-mysql-net
    restart: unless-stopped

  # =========================
  # EUREKA
  # =========================

  eurekaserver:
    container_name: bankapp-eureka-container
    build:
      context: ./BankApp-EurekaServer/
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    networks:
      - springboot-mysql-net
    restart: on-failure

  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    container_name: bankapp-api-container
    build:
      context: ./BankServer-Api-Gateway/
      dockerfile: Dockerfile
    ports:
      - "2222:2222"
    depends_on:
      - eurekaserver
    networks:
      - springboot-mysql-net
    restart: on-failure

  # =========================
  # AUTHENTICATION
  # =========================

  authentication-service:
    container_name: bankapp-auth-service-container
    build:
      context: ./BankApp-AuthenticationService/
      dockerfile: Dockerfile
    depends_on:
      - eurekaserver
      - redis-server
      - auth-db
    networks:
      - springboot-mysql-net
    restart: on-failure

  # =========================
  # CUSTOMER
  # =========================

  customer-service:
    container_name: bankapp-customer-service-container
    build:
      context: ./BankApp-CustomerService/
      dockerfile: Dockerfile
    depends_on:
      - eurekaserver
      - api-gateway
      - authentication-service
      - axonserver
      - customer-db
    networks:
      - springboot-mysql-net
    restart: on-failure

  # =========================
  # ACCOUNT
  # =========================

  account-service:
    container_name: bankapp-account-service-container
    build:
      context: ./BankApp-AccountService/
      dockerfile: Dockerfile
    depends_on:
      - eurekaserver
      - api-gateway
      - authentication-service
      - axonserver
      - account-db
    networks:
      - springboot-mysql-net
    restart: on-failure

  # =========================
  # TRANSACTION
  # =========================

  transaction-service:
    container_name: bankapp-transaction-service-container
    build:
      context: ./BankApp-TransactionService/
      dockerfile: Dockerfile
    depends_on:
      - eurekaserver
      - api-gateway
      - authentication-service
      - axonserver
      - transaction-db
    networks:
      - springboot-mysql-net
    restart: on-failure

  # =========================
  # MONITORING
  # =========================

  monitoring-service:
    container_name: bankapp-monitoring-container
    build:
      context: ./BankApp-Monitoring/
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
      - authentication-service
      - customer-service
      - account-service
      - transaction-service
    networks:
      - springboot-mysql-net
    restart: on-failure